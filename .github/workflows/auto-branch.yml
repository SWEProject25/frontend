name: Create Branch When Issue Moves To In Progress

on:
  projects_v2_item:
    types: [edited]

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Status moved from To Do → In Progress
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const payload = context.payload;

            // Ensure it's linked to an Issue
            if (!payload.projects_v2_item.content?.type || payload.projects_v2_item.content?.type !== "Issue") {
              console.log("Not an issue, skipping.");
              return;
            }

            // Get before/after changes for the Status field
            const changes = payload.changes?.field_value_by_name;
            if (!changes) {
              console.log("No status change detected.");
              return;
            }

            const previous = changes.Status?.from;
            const current = changes.Status?.to;

            console.log(`Previous: ${previous}, Current: ${current}`);

            if (previous === "To Do" && current === "In Progress") {
              core.setOutput("create_branch", "true");
            }
      - name: Create branch
        if: steps.check.outputs.create_branch == 'true'
        uses: peter-evans/create-issue-branch@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: feature/issue-${{ github.event.projects_v2_item.content.number }}
