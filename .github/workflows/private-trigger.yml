name: Trigger Docker Build
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: self-hosted
    env:
      DEVOPS_OWNER: SWEProject25
      DEVOPS_REPO: devops
      DEVOPS_BRANCH: main
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install unzip (if missing)
        run: |
          if ! command -v unzip &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y unzip
          fi

      - name: Clone devops repo
        run: |
          git clone -q https://${{ secrets.PAT_GITHUB }}@github.com/${DEVOPS_OWNER}/${DEVOPS_REPO}.git devops
          cd devops
          git checkout -q ${DEVOPS_BRANCH}

      - name: Copy SonarQube properties
        run: |
          if [ -f "devops/${REPO_NAME}/sonar-project.properties" ]; then
            echo "Copying sonar-project.properties from devops/${REPO_NAME}/"
            cp devops/${REPO_NAME}/sonar-project.properties ./sonar-project.properties
          else
            echo "Warning: sonar-project.properties not found in devops/${REPO_NAME}/"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Clean Code
        run: npx prettier --write .

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build project
        run:
          npm run build
          # SonarQube scan - ONLY on push (not PR)
      - name: SonarQube Scan
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Cleanup devops repo
        if: always()
        run: |
          if [ -d "devops" ]; then
            rm -rf devops
          fi

  trigger-public-workflow:
    needs: test-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger public repo workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_GITHUB }}" \
            https://api.github.com/repos/karimfaridz/runner/dispatches \
            -d '{
              "event_type": "trigger-build",
              "client_payload": {
                "owner_name": "${{ github.repository_owner }}",
                "repo_name": "${{ github.event.repository.name }}",
                "branch": "${{ github.ref_name }}"
              }
            }'
