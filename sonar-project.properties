# Self-hosted SonarQube URL
sonar.host.url=https://sonar.hankers.tech

sonar.projectKey=Hankers_frontend
sonar.projectName=Hankers Frontend
sonar.projectVersion=1.0

# Sources
sonar.sources=src

# Exclusions (match your Vitest excludes)
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/node_modules/**,**/dist/**,**/coverage/**,**/test/**,**/*.d.ts,**/types/**,**/*.config.*,**/mocks/**,**/app/**,**/page.tsx,**/layout.tsx

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Coverage - try BOTH properties
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
